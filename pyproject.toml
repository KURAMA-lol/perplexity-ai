[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perplexity-cookie-api"
version = "1.0.0"
description = "OpenAI-compatible API for the Perplexity web client"
requires-python = ">=3.10"
dependencies = [
  "curl_cffi>=0.5.7",
  "starlette>=0.37,<1",
]

[tool.setuptools.packages.find]
include = ["perplexity*"]
